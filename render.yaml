services:
  - type: web
    name: mandisetu-api
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    initialDeployHook: python -m app.seed_sih_showcase
    envVars:
      - key: KISANSETU_DB_PATH
        value: /data/kisansetu.sqlite3
      - key: MANDISETU_JOBS_ENABLED
        value: "1"
      - key: MANDISETU_SMS_MODE
        value: demo
      - key: MANDISETU_DEMO_ACCESS
        value: "1"
      - key: MANDISETU_CORS_ORIGINS
        sync: false
    disk:
      name: mandisetu-data
      mountPath: /data
      sizeGB: 1
