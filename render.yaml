databases:
  - name: mandisetu-db
    plan: free

services:
  - type: web
    name: mandisetu-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    initialDeployHook: python -m app.seed_sih_showcase
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mandisetu-db
          property: connectionString
      - key: MANDISETU_JOBS_ENABLED
        value: "1"
      - key: MANDISETU_SMS_MODE
        value: demo
      - key: MANDISETU_DEMO_ACCESS
        value: "1"
      - key: MANDISETU_CORS_ORIGINS
        sync: false
